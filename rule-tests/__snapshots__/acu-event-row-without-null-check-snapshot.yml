    public class HCODxInventoryItemMaint : PXGraphExtension<InventoryItemMaint>
    {
        protected virtual void HCODItemManufacturer_IsDefault_FieldUpdating(PXCache sender, PXFieldUpdatingEventArgs e)
        {
            var row = e.Row as HCODItemManufacturer;
            if ((bool?)e.NewValue == true && row.BranchID != null)
            {
                ClearOtherDefaults(row.InventoryID, row.BranchID);
            }
        }
    }
