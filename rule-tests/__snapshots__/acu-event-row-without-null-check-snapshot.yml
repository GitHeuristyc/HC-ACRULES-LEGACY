    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        protected virtual void _(Events.RowSelected<SOOrder> e)
        {
            Base.Document.Cache.AllowDelete = e.Row.Hold == true;
            Base.Transactions.Cache.AllowInsert = e.Row.Hold == true;
        }
    }
