    public class HCODxTermsMaint : PXGraphExtension<TermsMaint>
    {
        protected virtual void _(Events.RowSelected<Terms> e, PXRowSelected baseHandler)
        {
            baseHandler?.Invoke(e.Cache, e.Args);
            Terms term = e.Row;
            PXUIFieldAttribute.SetEnabled<Terms.dayDue00>(e.Cache, term, term.DueType != HCODTermsDueType.SecondDay);
        }
    }
