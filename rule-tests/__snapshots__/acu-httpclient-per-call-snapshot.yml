    public class WeatherAPI
    {
        public string GetCurrent(string zipcode)
        {
            HttpClient client = new HttpClient();
            return client.GetStringAsync("https://api.example.com/current?q=" + zipcode).GetAwaiter().GetResult();
        }
    }
