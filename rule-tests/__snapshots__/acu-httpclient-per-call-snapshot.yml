    public class HCSOOrderEntryExt : PXGraphExtension<SOOrderEntry>
    {
        public PXAction<SOOrder> sendOrder;
        [PXButton, PXUIField(DisplayName = "Send")]
        protected virtual IEnumerable SendOrder(PXAdapter adapter)
        {
            Base.LongOperationManager.StartAsyncOperation(async ct =>
            {
                using (var client = new System.Net.Http.HttpClient())
                    await client.PostAsync(Endpoint, Content(), ct);
            });
            return adapter.Get();
        }
    }
