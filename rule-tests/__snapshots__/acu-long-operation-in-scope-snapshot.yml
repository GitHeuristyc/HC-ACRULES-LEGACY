  ? |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual IEnumerable Process(PXAdapter adapter)
        {
            using (PXTransactionScope ts = new PXTransactionScope())
            {
                Actions.PressSave();
                PXLongOperation.StartOperation(this, () => HCODSync.Run());
                ts.Complete();
            }
            return adapter.Get();
        }
    }
