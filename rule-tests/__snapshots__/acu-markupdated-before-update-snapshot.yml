    public class Posting
    {
        void CreateProjectTran(RegisterEntry graph, GLTran tran)
        {
            PMTran pmt = (PMTran)graph.Transactions.Cache.Insert();
            pmt.ProjectID = tran.ProjectID;
            pmt.TaskID = tran.TaskID;
            PXNoteAttribute.CopyNoteAndFiles(glCache, tran, graph.Transactions.Cache, pmt);
            try
            {
                graph.Transactions.Update(pmt);
            }
            catch (PXFieldValueProcessingException) { throw; }
        }
    }
