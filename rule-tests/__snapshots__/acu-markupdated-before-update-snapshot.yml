    public class QuoteToOrder
    {
        void CreateLine(SOOrderEntry graph, QuickLine source)
        {
            SOLine newLine = graph.Transactions.Insert();
            newLine.InventoryID = source.InventoryID;
            if (lotSerialRequired)
            {
                newLine.LocationID = source.LocationID;
            }
            newLine.OrderQty = source.OrderQty;
            Helper.CopyLineNoteAndFilesToGeneratedDocument(defaults, sourceCache, source, graph.Transactions.Cache, newLine);
            newLine = graph.Transactions.Update(newLine);
        }
    }
