    public class Quotes
    {
        void Copy(QuoteMaint graph, Guid[] files)
        {
            var quote = graph.Quote.Insert(new CRQuote());
            quote = graph.Quote.Update(quote);
            quote.TermsID = terms;
            PXNoteAttribute.SetFileNotes(graph.Quote.Cache, quote, files);
            graph.Quote.Update(quote);
        }
    }
