  ? |
    public class HCTCTimeEntryMaint : PXGraph<HCTCTimeEntryMaint>
    {
        public virtual IEnumerable StartClock(PXAdapter adapter)
        {
            PXLongOperation.StartOperation(this, delegate
            {
                var graph = PXGraph.CreateInstance<HCTCClockMaint>();
                throw new PXPopupRedirectException(graph, string.Empty, true);
            });
            return adapter.Get();
        }
    }
