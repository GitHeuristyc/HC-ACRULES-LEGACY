    using PX.SM;
    public class HCPDFileHelper
    {
        public static void Attach(PXCache cache, object row, FileInfo file)
        {
            var fileGraph = PXGraph.CreateInstance<UploadFileMaintenance>();
            fileGraph.SaveFile(file, FileExistsAction.CreateVersion);
            PXNoteAttribute.SetFileNotes(cache, row, file.UID.Value);
        }
    }
