  ? |
    public class HCAPInvoiceEntryExt : PXGraphExtension<APInvoiceEntry>
    {
        public static bool IsActive() => true;
        protected virtual void APInvoice_RowSelected(PXCache sender, PXRowSelectedEventArgs e)
        {
            PX.Data.PXNoteAttribute.SetNote(sender, e.Row, GetSourceNote());
        }
    }
