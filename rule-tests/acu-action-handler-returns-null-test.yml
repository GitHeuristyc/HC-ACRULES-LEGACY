id: acu-action-handler-returns-null
valid:
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        public PXAction<SOOrder> approveOrder;
        [PXButton(CommitChanges = true)]
        [PXUIField(DisplayName = "Approve")]
        public virtual IEnumerable ApproveOrder(PXAdapter adapter)
        {
            if (Base.Document.Current == null)
            {
                return adapter.Get();
            }
            PXLongOperation.StartOperation(Base, () =>
            {
                HCODApprovalService.Approve();
            });
            return adapter.Get();
        }
    }
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
