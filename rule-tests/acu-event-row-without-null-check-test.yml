    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        protected virtual void HCODWidget_RowSelected(PXCache sender, PXRowSelectedEventArgs e)
        {
            HCODWidget row = (HCODWidget)e.Row;
            if (row.CustomerID == null) return;
            PXUIFieldAttribute.SetEnabled<HCODWidget.descr>(sender, row, row.Active == true);
