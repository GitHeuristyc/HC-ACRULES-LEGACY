    public class HCODxTermsMaint : PXGraphExtension<TermsMaint>
    {
        protected virtual void _(Events.RowSelected<Terms> e, PXRowSelected baseHandler)
        {
            baseHandler?.Invoke(e.Cache, e.Args);
            Terms term = e.Row;
            PXUIFieldAttribute.SetEnabled<Terms.dayDue00>(e.Cache, term, term.DueType != HCODTermsDueType.SecondDay);
        }
    }
  - |
    public class HCODxPOReceiptEntry : PXGraphExtension<POReceiptEntry>
    {
        protected virtual void _(Events.RowSelected<HCODNcmFilter> e)
        {
            HCODNcmFilter row = (HCODNcmFilter)e.Row;
            PXUIFieldAttribute.SetEnabled<HCODNcmFilter.descr>(e.Cache, row, row.ReasonCode == HCODNcmReasons.WrongItem);
            PXUIFieldAttribute.SetEnabled<HCODNcmFilter.uoM>(e.Cache, row, row?.ReasonCode == HCODNcmReasons.WrongItem);
        }
    }
  - |
    public class HCODxInventoryItemMaint : PXGraphExtension<InventoryItemMaint>
    {
        protected virtual void HCODItemManufacturer_IsDefault_FieldUpdating(PXCache sender, PXFieldUpdatingEventArgs e)
        {
            var row = e.Row as HCODItemManufacturer;
            if ((bool?)e.NewValue == true && row.BranchID != null)
            {
                ClearOtherDefaults(row.InventoryID, row.BranchID);
            }
        }
    }
