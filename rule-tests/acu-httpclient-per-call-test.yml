id: acu-httpclient-per-call
valid:
  - |
    public class HCRateService
    {
        private static readonly HttpClient SharedClient = new HttpClient { Timeout = TimeSpan.FromSeconds(30) };

        public async Task<string> GetRateAsync(string url, CancellationToken ct)
        {
            using (var response = await SharedClient.GetAsync(url, ct))
                return await response.Content.ReadAsStringAsync();
        }
    }
  - |
    public class HCRateService
    {
        private readonly IHttpClientFactory _factory;
        public HCRateService(IHttpClientFactory factory) { _factory = factory; }

        public async Task<string> GetRateAsync(string url, CancellationToken ct)
        {
            HttpClient client = _factory.CreateClient("rates");
            return await client.GetStringAsync(url);
        }
    }
  - |
    public static class HCHttp
    {
        private static readonly Lazy<HttpClient> Client = new Lazy<HttpClient>(() => new HttpClient());
        private static HttpClient CreateClient()
        {
            return new HttpClient(new HttpClientHandler { AllowAutoRedirect = false });
        }
    }
  - |
    public class HCGeocoder
    {
        private readonly HttpClient _httpClient;
        public HCGeocoder() { _httpClient = new HttpClient(); }
    }
invalid:
  - |
    public class WeatherAPI
    {
        public string GetCurrent(string zipcode)
        {
            HttpClient client = new HttpClient();
            return client.GetStringAsync("https://api.example.com/current?q=" + zipcode).GetAwaiter().GetResult();
        }
    }
  - |
    public class HCSOOrderEntryExt : PXGraphExtension<SOOrderEntry>
    {
        public PXAction<SOOrder> sendOrder;
        [PXButton, PXUIField(DisplayName = "Send")]
        protected virtual IEnumerable SendOrder(PXAdapter adapter)
        {
            Base.LongOperationManager.StartAsyncOperation(async ct =>
            {
                using (var client = new System.Net.Http.HttpClient())
                    await client.PostAsync(Endpoint, Content(), ct);
            });
            return adapter.Get();
        }
    }
