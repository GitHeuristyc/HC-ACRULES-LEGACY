id: acu-long-operation-in-scope
valid:
  - |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual IEnumerable Process(PXAdapter adapter)
        {
            PXLongOperation.StartOperation(this, () =>
            {
                using (var ts = new PXTransactionScope())
                {
                    var graph = PXGraph.CreateInstance<HCODWidgetMaint>();
                    graph.Actions.PressSave();
                    ts.Complete();
                }
            });
            return adapter.Get();
        }
    }
  - |
    public class HCODWebhookHandler
    {
        public void Handle(string company)
        {
            PXLongOperation.StartOperation(Guid.NewGuid(), () =>
            {
                using (new PXLoginScope("admin@" + company))
                {
                    HCODSync.Run();
                }
            });
        }
    }
