id: acu-popup-redirect-in-long-operation
valid:
  - |
    public class HCTCTimeEntryMaint : PXGraph<HCTCTimeEntryMaint>
    {
        public virtual IEnumerable StartClock(PXAdapter adapter)
        {
            var graph = PXGraph.CreateInstance<HCTCClockMaint>();
            PXRedirectHelper.TryRedirect(graph, PXRedirectHelper.WindowMode.Popup);
            return adapter.Get();
        }
    }
  - |
    public class HCTCTimeEntryMaint : PXGraph<HCTCTimeEntryMaint>
    {
        public virtual IEnumerable PrintAll(PXAdapter adapter)
        {
            PXLongOperation.StartOperation(this, () =>
            {
                var graph = PXGraph.CreateInstance<HCTCClockMaint>();
                PXRedirectHelper.TryRedirect(graph, PXRedirectHelper.WindowMode.NewWindow);
            });
            return adapter.Get();
        }
    }
