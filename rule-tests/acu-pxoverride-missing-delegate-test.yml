id: acu-pxoverride-missing-delegate
valid:
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        [PXOverride]
        public decimal CalcDiscount(SOOrder order, Func<SOOrder, decimal> base_CalcDiscount)
        {
            return base_CalcDiscount(order);
        }
    }
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        public delegate IEnumerable ReleaseDelegate(PXAdapter adapter);

        [PXOverride]
        public IEnumerable Release(PXAdapter adapter, ReleaseDelegate base_Release)
        {
            return base_Release(adapter);
        }

        [PXOverride]
        public void Persist(Action base_Persist) { base_Persist(); }
    }
invalid:
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        [PXOverride]
        public decimal CalcDiscount(SOOrder order)
        {
            return 0m;
        }
    }
  - |
    public class HCODxSOOrderEntry : PXGraphExtension<SOOrderEntry>
    {
        [PXOverride]
        public void Persist()
        {
            Base.Persist();
        }
    }
