id: acu-transaction-scope-without-complete
valid:
  - |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual void SaveBoth(HCODWidgetMaint other)
        {
            using (var ts = new PXTransactionScope())
            {
                Actions.PressSave();
                other.Actions.PressSave();
                ts.Complete();
            }
        }
    }
  - |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual void SaveBoth(HCODWidgetMaint other)
        {
            using (PXTransactionScope ts = new PXTransactionScope())
            {
                if (other == null) return;
                other.Actions.PressSave();
                ts.Complete(this);
            }
            using (new PXConnectionScope())
            {
                Widgets.Select();
            }
        }
    }
invalid:
  - |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual void SaveBoth(HCODWidgetMaint other)
        {
            using (var ts = new PXTransactionScope())
            {
                Actions.PressSave();
                other.Actions.PressSave();
            }
        }
    }
  - |
    public class HCODWidgetMaint : PXGraph<HCODWidgetMaint>
    {
        public virtual void SaveLog()
        {
            using (new PXTransactionScope())
            {
                Actions.PressSave();
            }
        }
    }
