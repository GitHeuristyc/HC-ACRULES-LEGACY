    internal class HCFedexWebhookHandler : IWebhookHandler
    {
        public Task HandleAsync(WebhookContext context, CancellationToken cancellation) => Task.CompletedTask;
    }
  - |
    class HCOrderWebhook : PXGraph<HCOrderWebhook>, PX.Api.Webhooks.IWebhookHandler
    {
        async Task IWebhookHandler.HandleAsync(WebhookContext context, CancellationToken cancellation) { }
    }
