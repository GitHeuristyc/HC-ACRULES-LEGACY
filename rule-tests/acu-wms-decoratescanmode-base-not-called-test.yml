id: acu-wms-decoratescanmode-base-not-called
valid:
  - |
    public class HCPickPackShipExt : PXGraphExtension<PickPackShip, PickPackShip.Host>
    {
        public static bool IsActive() => true;
        [PXOverride]
        public virtual ScanMode<PickPackShip> DecorateScanMode(ScanMode<PickPackShip> original,
            Func<ScanMode<PickPackShip>, ScanMode<PickPackShip>> base_DecorateScanMode)
        {
            var mode = base_DecorateScanMode(original);
            if (mode is PickPackShip.PickMode pick)
                pick.Intercept.CreateStates.ByAppend(() => new[] { new HCLabelState() });
            return mode;
        }
    }
  - |
    public class HCPickPackShipExt : PXGraphExtension<PickPackShip, PickPackShip.Host>
    {
        public static bool IsActive() => true;
        [PXOverride]
        public ScanMode<PickPackShip> DecorateScanMode(ScanMode<PickPackShip> original, Func<ScanMode<PickPackShip>, ScanMode<PickPackShip>> baseMethod)
            => Decorate(baseMethod(original));
    }
