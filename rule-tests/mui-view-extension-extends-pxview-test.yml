    export interface HCEMMyView extends PXView {}
    export class HCEMMyView {
      UsrCustomField1: PXFieldState;
      UsrCustomField2: PXFieldState;
    }
  - |
    import { PXFieldState, PXView } from "client-controls";
    import { SO301000 } from "src/screens/SO/SO301000/SO301000";

    export interface SO301000_HCUS extends SO301000 {}
