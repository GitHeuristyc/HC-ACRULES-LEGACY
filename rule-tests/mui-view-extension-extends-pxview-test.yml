    export interface HCEMAMClockItem extends AMClockItem {}
    export class HCEMAMClockItem {
      UsrShowOpenPOOnly: PXFieldState;
    }
  - |
    import { PXView, PXFieldState } from "client-controls";

    export class HCEMPackageCounterFilter extends PXView {
      QuantityCounter: PXFieldState;
    }
  - |
    import { PXView, PXFieldState } from "client-controls";

    export interface HCTCRowShape extends PXView {
