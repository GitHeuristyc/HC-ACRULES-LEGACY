id: acu-hardcoded-credential
language: csharp
severity: error
message: "Credential or token written as a string literal. Secrets in source leak through the repository and packages; read them from a setup DAC field encrypted with [PXRSACryptString]."
metadata:
  skill: acumatica-contract-api
rule:
  kind: object_creation_expression
  any:
    - all:
        - has: { field: type, regex: '(^|\.)NetworkCredential$' }
        - has:
            field: arguments
            has:
              kind: argument
              nthChild: 2
              has: { kind: string_literal, regex: '^@?"[^"]+"$' }
    - all:
        - has: { field: type, regex: '(^|\.)AuthenticationHeaderValue$' }
        - has:
            field: arguments
            has:
              kind: argument
              nthChild: 2
              has: { kind: string_literal, regex: '^@?"[^"]+"$' }
