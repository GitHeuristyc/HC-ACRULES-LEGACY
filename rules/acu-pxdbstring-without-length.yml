id: acu-pxdbstring-without-length
language: csharp
severity: warning
message: "[PXDBString] without a length. The UI then accepts text of any size, and a value longer than the database column fails on save with a SQL truncation error. Pass the column length as the first argument, for example [PXDBString(15, IsUnicode = true)]; only nvarchar(max) columns may omit it."
metadata:
  skill: acumatica-dac
rule:
  kind: attribute
  has: { field: name, regex: '^PXDBString(Attribute)?$' }
  not:
    has:
      stopBy: end
      kind: attribute_argument
      not: { regex: '^\s*\w+\s*[=:]' }
