id: acu-pxoverride-base-skipped-uncommented
language: csharp
severity: warning
message: "[PXOverride] method never calls its base delegate and has no comment that says why. Call the delegate, or add a comment in the method body that explains why the override replaces the base logic. If the delegate is passed to a helper that calls it, say so in the comment."
note: |
  The rule checks that a comment other than TODO, FIXME or HACK exists; the
  review judges whether it explains why the base is skipped.
  Persist and ConfirmShipment are left to acu-pxoverride-base-not-called, which
  asks for the base call in every case.
metadata:
  skill: acumatica-blc-extension
rule:
  # Reported on the declared name so that only edits to the declaration line raise it.
  any:
    - kind: identifier
    - kind: qualified_name
  inside:
    field: name
    kind: method_declaration
    all:
      - has: { kind: attribute_list, regex: '^\[\s*(PX\.Data\.)?PXOverride(Attribute)?\s*(\(\s*\))?\s*\]$' }
      - not: { has: { field: name, regex: '^(Persist|ConfirmShipment)$' } }
      - has:
          field: parameters
          has:
            kind: parameter
            nthChild: { position: 1, reverse: true, ofRule: { kind: parameter } }
            all:
              - has: { field: type, regex: '^(System\.)?(Func|Action)\b|(Delegate|Del|Handler|Method|Callback)$' }
              - has: { field: name, pattern: $DEL }
      - has:
          any:
            - kind: block
            - kind: arrow_expression_clause
          not:
            any:
              # A call or an Invoke call, including one inside a lambda.
              - has: { stopBy: end, pattern: '$DEL($$$ARGS)' }
              - has: { stopBy: end, pattern: '$DEL.Invoke($$$ARGS)' }
              - has: { stopBy: end, kind: comment, not: { regex: '^//\s*(TODO|FIXME|HACK)\b' } }
